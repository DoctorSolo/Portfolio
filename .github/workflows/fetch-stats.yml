name: Fetch GitHub Stats

on:
  schedule:
    # Roda todo dia à meia-noite
    - cron: "0 0 * * *"
  # Permite rodar manualmente
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Buscar dados do GitHub
        run: |
          # Query GraphQL para pegar commits e repositórios
          QUERY='{
            "query": "query { 
              user(login: \"DoctorSolo\") { 
                contributionsCollection { 
                  totalCommitContributions 
                } 
                repositories(first: 100, privacy: ALL) { 
                  totalCount 
                } 
              } 
            }"
          }'

          # Faz a requisição para a API do GitHub
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            https://api.github.com/graphql)

          # Extrai os dados com jq
          COMMITS=$(echo $RESPONSE | jq '.data.user.contributionsCollection.totalCommitContributions')
          REPOS=$(echo $RESPONSE | jq '.data.user.repositories.totalCount')

          # Cria o arquivo JSON
          echo "{
            \"commits\": $COMMITS,
            \"repos\": $REPOS,
            \"updatedAt\": \"$(date -Iseconds)\"
          }" > public/github-stats.json

      - name: Commit e push das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: atualizar stats do GitHub [skip ci]"
          git push
