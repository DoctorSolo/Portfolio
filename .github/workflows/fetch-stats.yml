name: Fetch GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Fetch and Process GitHub Stats
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TARGET_USER: "DoctorSolo"
        run: |
          set -e

          # 1. Obter lista de todos os anos de contribuição e totais de repositórios
          META_QUERY=$(cat <<EOF
          {"query": "query { user(login: \"$TARGET_USER\") { repositories(ownerAffiliations: [OWNER]) { totalCount } repositoriesPublic: repositories(ownerAffiliations: [OWNER], privacy: PUBLIC) { totalCount } repositoriesPrivate: repositories(ownerAffiliations: [OWNER], privacy: PRIVATE) { totalCount } contributionsCollection { contributionYears } } }"}
          EOF
          )

          META_RESPONSE=$(curl -s -X POST \
            -H "Authorization: bearer $PAT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$META_QUERY" \
            https://api.github.com/graphql)

          if echo "$META_RESPONSE" | jq -e '.errors' > /dev/null; then
            echo "❌ Erro na consulta de metadados:"
            echo "$META_RESPONSE" | jq '.errors'
            exit 1
          fi

          YEARS=$(echo "$META_RESPONSE" | jq -r '.data.user.contributionsCollection.contributionYears[]')
          REPOS_TOTAL=$(echo "$META_RESPONSE" | jq -r '.data.user.repositories.totalCount // 0')
          REPOS_PUBLIC=$(echo "$META_RESPONSE" | jq -r '.data.user.repositoriesPublic.totalCount // 0')
          REPOS_PRIVATE=$(echo "$META_RESPONSE" | jq -r '.data.user.repositoriesPrivate.totalCount // 0')

          # 2. Montar query dinâmica para todos os anos
          FIELDS=""
          for Y in $YEARS; do
            FIELDS="$FIELDS y$Y: contributionsCollection(from: \"${Y}-01-01T00:00:00Z\", to: \"${Y}-12-31T23:59:59Z\") { totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions restrictedContributionsCount }"
          done

          STATS_QUERY=$(jq -n --arg q "query { user(login: \"$TARGET_USER\") { $FIELDS } }" '{"query": $q}')

          STATS_RESPONSE=$(curl -s -X POST \
            -H "Authorization: bearer $PAT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$STATS_QUERY" \
            https://api.github.com/graphql)

          if echo "$STATS_RESPONSE" | jq -e '.errors' > /dev/null; then
            echo "❌ Erro na consulta de contribuições:"
            echo "$STATS_RESPONSE" | jq '.errors'
            exit 1
          fi

          # 3. Somar todas as contribuições de todos os anos
          TOTAL_CONTRIBUTIONS=$(echo "$STATS_RESPONSE" | jq '[.data.user[] | (.totalCommitContributions + .totalIssueContributions + .totalPullRequestContributions + .totalPullRequestReviewContributions + .restrictedContributionsCount)] | add // 0')

          mkdir -p public

          # 4. Gerar o arquivo JSON
          jq -n \
            --arg totalContribs "$TOTAL_CONTRIBUTIONS" \
            --arg total "$REPOS_TOTAL" \
            --arg public "$REPOS_PUBLIC" \
            --arg private "$REPOS_PRIVATE" \
            --arg date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              contributions: ($totalContribs | tonumber),
              repos: {
                total: ($total | tonumber),
                public: ($public | tonumber),
                private: ($private | tonumber)
              },
              updatedAt: $date
            }' > public/github-stats.json

      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit and Push
        run: |
          git config user.name "NexusHub-Bot[bot]"
          git config user.email "${{ secrets.CLIENT_ID }}+NexusHub-Bot[bot]@users.noreply.github.com"
          
          git remote set-url origin https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/${{ github.repository }}.git
          
          git add public/github-stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push
