name: Fetch GitHub Stats (com privados)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Buscar dados do GitHub (GraphQL com privados)
        run: |
          # Query GraphQL para pegar públicos E privados
          QUERY='{"query": "query { user(login: \"DoctorSolo\") { contributionsCollection { totalCommitContributions } repositories(first: 100, privacy: ALL) { totalCount } repositoriesPublic: repositories(privacy: PUBLIC) { totalCount } repositoriesPrivate: repositories(privacy: PRIVATE) { totalCount } } }"}'

          # Faz a requisição com o token
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            https://api.github.com/graphql)

          # Extrai os dados
          COMMITS=$(echo $RESPONSE | jq '.data.user.contributionsCollection.totalCommitContributions')
          REPOS_TOTAL=$(echo $RESPONSE | jq '.data.user.repositories.totalCount')
          REPOS_PUBLIC=$(echo $RESPONSE | jq '.data.user.repositoriesPublic.totalCount')
          REPOS_PRIVATE=$(echo $RESPONSE | jq '.data.user.repositoriesPrivate.totalCount')

          # Cria a pasta public
          mkdir -p public

          # Cria o JSON com todos os dados
          echo "{
            \"commits\": $COMMITS,
            \"repos\": {
              \"total\": $REPOS_TOTAL,
              \"public\": $REPOS_PUBLIC,
              \"private\": $REPOS_PRIVATE
            },
            \"updatedAt\": \"$(date -Iseconds)\"
          }" > public/github-stats.json

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: atualizar stats do GitHub [skip ci]"
          git push
