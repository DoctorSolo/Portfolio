name: Fetch GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Search Github data (GraphQL History)
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -e

          QUERY=$(cat << 'EOF'
          {"query": "query { user(login: \"DoctorSolo\") { repositories { totalCount } repositoriesPublic: repositories(privacy: PUBLIC) { totalCount } repositoriesPrivate: repositories(privacy: PRIVATE) { totalCount } c2023: contributionsCollection(from: \"2023-01-01T00:00:00Z\", to: \"2023-12-31T23:59:59Z\") { totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions restrictedContributionsCount } c2024: contributionsCollection(from: \"2024-01-01T00:00:00Z\", to: \"2024-12-31T23:59:59Z\") { totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions restrictedContributionsCount } c2025: contributionsCollection(from: \"2025-01-01T00:00:00Z\", to: \"2025-12-31T23:59:59Z\") { totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions restrictedContributionsCount } c2026: contributionsCollection(from: \"2026-01-01T00:00:00Z\", to: \"2026-12-31T23:59:59Z\") { totalCommitContributions totalIssueContributions totalPullRequestContributions totalPullRequestReviewContributions restrictedContributionsCount } } }"}
          EOF
          )

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: bearer $PAT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            https://api.github.com/graphql)

          if echo "$RESPONSE" | jq -e '.errors' > /dev/null; then
            echo "❌ Erro na consulta GraphQL:"
            echo "$RESPONSE" | jq '.errors'
            exit 1
          fi

          # Extrai as contribuições de cada ano
          C2023=$(echo "$RESPONSE" | jq -r '.data.user.c2023 | (.totalCommitContributions + .totalIssueContributions + .totalPullRequestContributions + .totalPullRequestReviewContributions + .restrictedContributionsCount) // 0')
          C2024=$(echo "$RESPONSE" | jq -r '.data.user.c2024 | (.totalCommitContributions + .totalIssueContributions + .totalPullRequestContributions + .totalPullRequestReviewContributions + .restrictedContributionsCount) // 0')
          C2025=$(echo "$RESPONSE" | jq -r '.data.user.c2025 | (.totalCommitContributions + .totalIssueContributions + .totalPullRequestContributions + .totalPullRequestReviewContributions + .restrictedContributionsCount) // 0')
          C2026=$(echo "$RESPONSE" | jq -r '.data.user.c2026 | (.totalCommitContributions + .totalIssueContributions + .totalPullRequestContributions + .totalPullRequestReviewContributions + .restrictedContributionsCount) // 0')

          # Soma total matemática
          COMMITS=$((C2023 + C2024 + C2025 + C2026))

          REPOS_TOTAL=$(echo "$RESPONSE" | jq -r '.data.user.repositories.totalCount // 0')
          REPOS_PUBLIC=$(echo "$RESPONSE" | jq -r '.data.user.repositoriesPublic.totalCount // 0')
          REPOS_PRIVATE=$(echo "$RESPONSE" | jq -r '.data.user.repositoriesPrivate.totalCount // 0')

          mkdir -p public

          jq -n \
            --arg commits "$COMMITS" \
            --arg total "$REPOS_TOTAL" \
            --arg public "$REPOS_PUBLIC" \
            --arg private "$REPOS_PRIVATE" \
            --arg date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              commits: ($commits | tonumber),
              repos: {
                total: ($total | tonumber),
                public: ($public | tonumber),
                private: ($private | tonumber)
              },
              updatedAt: $date
            }' > public/github-stats.json

      - name: Generate App Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit and Push
        run: |
          git config user.name "NexusHub-Bot[bot]"
          git config user.email "${{ steps.generate_token.outputs.app-id }}+NexusHub-Bot[bot]@users.noreply.github.com"
          
          git remote set-url origin https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/${{ github.repository }}.git
          
          git add public/github-stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push
