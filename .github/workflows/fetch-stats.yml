name: Fetch GitHub Stats (com privados)

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@lasted

      - name: Buscar dados do GitHub (GraphQL com privados)
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          QUERY='{"query": "query { user(login: \"DoctorSolo\") { contributionsCollection { totalCommitContributions } repositories(first: 100, privacy: ALL) { totalCount } repositoriesPublic: repositories(privacy: PUBLIC) { totalCount } repositoriesPrivate: repositories(privacy: PRIVATE) { totalCount } } }"}'

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: bearer $PAT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$QUERY" \
            https://api.github.com/graphql)

          COMMITS=$(echo "$RESPONSE" | jq -r '.data.user.contributionsCollection.totalCommitContributions // 0')
          REPOS_TOTAL=$(echo "$RESPONSE" | jq -r '.data.user.repositories.totalCount // 0')
          REPOS_PUBLIC=$(echo "$RESPONSE" | jq -r '.data.user.repositoriesPublic.totalCount // 0')
          REPOS_PRIVATE=$(echo "$RESPONSE" | jq -r '.data.user.repositoriesPrivate.totalCount // 0')

          mkdir -p public

          jq -n \
            --arg commits "$COMMITS" \
            --arg total "$REPOS_TOTAL" \
            --arg public "$REPOS_PUBLIC" \
            --arg private "$REPOS_PRIVATE" \
            --arg date "$(date -Iseconds)" \
            '{
              commits: ($commits | tonumber),
              repos: {
                total: ($total | tonumber),
                public: ($public | tonumber),
                private: ($private | tonumber)
              },
              updatedAt: $date
            }' > public/github-stats.json

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-stats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: atualizar stats do GitHub [skip ci]"
          git push
